<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Демонстрационный пример · HTDC</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2306080d'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%23d6e6f5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Документы витрины открываются в рамке. Шапка даёт путь назад, пометку и действие -->
<div class="viewer">
  <header class="viewer__bar">
    <a class="nav__mark" href="index.html" aria-label="HTDC, на главную">HTDC</a>
    <div class="viewer__id">
      <h1 class="viewer__title" data-title>Демонстрационный пример</h1>
      <p class="viewer__note">Демонстрационный пример. Показывает формат документа, а не данные клиента.</p>
    </div>
    <div class="viewer__actions">
      <a class="link" href="tools.html" data-back>К инструментам</a>
      <a class="link" data-pdf hidden download>Скачать PDF</a>
      <a class="btn btn--small" href="index.html#contact">Обсудить</a>
    </div>
  </header>

  <iframe class="viewer__frame" data-frame title="Демонстрационный пример" hidden></iframe>

  <main class="viewer__list" data-list>
    <p class="lead">Выберите пример:</p>
    <noscript><p>Для просмотра в рамке нужен JavaScript. Откройте пример по ссылке со страницы <a class="link" href="tools.html">инструментов</a>.</p></noscript>
  </main>
</div>

<script src="showcase/examples.js"></script>
<script>
(() => {
  const examples = window.HTDC_EXAMPLES || [];
  const id = new URLSearchParams(location.search).get("doc");
  const ex = examples.find((e) => e.id === id);
  const list = document.querySelector("[data-list]");

  if (!ex) {
    // Нет такого примера: показываем список всех
    for (const e of examples) {
      const a = document.createElement("a");
      a.className = "link";
      a.href = "example.html?doc=" + e.id;
      a.textContent = e.title;
      const p = document.createElement("p");
      p.append(a);
      list.append(p);
    }
    return;
  }

  document.title = ex.title + " · демонстрационный пример HTDC";
  document.querySelector("[data-title]").textContent = ex.title;
  // Назад: к тому инструменту, чей пример открыт
  const back = { "Управленческая инструкция": "#instructions", "Plasma": "#plasma", "Аватар компании": "#avatar" }[ex.product];
  if (back) document.querySelector("[data-back]").href = "tools.html" + back;

  const frame = document.querySelector("[data-frame]");
  frame.title = ex.title;
  frame.src = "showcase/" + ex.file;
  frame.hidden = false;
  list.hidden = true;

  if (ex.pdf) {
    const pdf = document.querySelector("[data-pdf]");
    pdf.href = "showcase/" + ex.pdf;
    pdf.setAttribute("download", "HTDC. " + ex.title.replace(":", ".") + ".pdf");
    pdf.hidden = false;
  }

  // Ссылки внутри документов ведут на страницы, которых здесь нет: гасим переходы и оставляем якоря
  frame.addEventListener("load", () => {
    try {
      frame.contentDocument.addEventListener("click", (e) => {
        const a = e.target.closest("a[href]");
        if (a && !a.getAttribute("href").startsWith("#")) e.preventDefault();
      });
    } catch { /* открыто с диска: браузер не даёт заглянуть в рамку, это не мешает просмотру */ }
  });
})();
</script>
</body>
</html>
